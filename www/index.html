<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de Página HTML</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Bienvenido a mi página web</h1>
    </header>
    <main>
        <p>Este es un ejemplo de una página HTML con CSS y JavaScript incluidos.</p>
        <img src="imagen.png" alt="Descripción de la imagen">
        <button id="myButton">Haz clic aquí</button>

        <section class="prueba-http">
            <h2>Probar el servidor</h2>
            <p>Escribí tus datos y elegí cómo enviarlos. Cada envío deja una línea en <code>logs/yyyy-MM-dd.log</code>.</p>
            <form id="formulario" autocomplete="off">
                <label for="nombre">Nombre</label>
                <input id="nombre" name="nombre" type="text" maxlength="50" required>

                <label for="mensaje">Mensaje</label>
                <input id="mensaje" name="mensaje" type="text" maxlength="200" required>

                <button id="btnGet" type="button">Enviar por GET (va en la URL)</button>
                <button id="btnPost" type="button">Enviar por POST (va en el cuerpo)</button>
            </form>
            <pre id="resultado" aria-live="polite">Todavía no se envió ninguna solicitud.</pre>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
